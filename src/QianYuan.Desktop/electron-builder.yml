appId: com.qianyuan.workpartner
productName: WorkPartner
directories:
  output: release
files:
  - dist/**
  - package.json
extraResources:
  - from: ../QianYuan.Web/dist
    to: web
    filter:
      - "**/*"
mac:
  category: public.app-category.productivity
  target:
    - dmg
win:
  target:
    - nsis
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true